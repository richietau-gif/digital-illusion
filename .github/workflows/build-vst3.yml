name: Build DI SIDECHAIN VST3
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# Only validate the newest commit per branch; previous GUI revisions are superseded.
concurrency:
  group: di-sidechain-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  windows-vst3:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S DI-SIDECHAIN -B build -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Regression tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          $exe = Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "pluginval.exe not found" }
          $vst = Get-ChildItem "build/DISidechain_artefacts/Release/VST3" -Filter "*.vst3" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $vst) { throw "VST3 not found" }
          # Windows GUI executables may return control before exiting when invoked
          # directly from PowerShell. Wait and inspect this process's exit code.
          $arguments = '--strictness-level 5 --validate-in-process --timeout-ms 120000 --validate "{0}"' -f $vst
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru -NoNewWindow
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force
            throw "pluginval exceeded the 180 second watchdog"
          }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "pluginval failed with exit code $($process.ExitCode)" }
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DI-SIDECHAIN-Windows-VST3
          path: build/DISidechain_artefacts/Release/VST3/*.vst3/
          if-no-files-found: error
