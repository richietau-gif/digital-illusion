name: Build DI SIDECHAIN VST3
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows-vst3:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S DI-SIDECHAIN -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DI-SIDECHAIN-Windows-VST3
          path: build/DISidechain_artefacts/Release/VST3/*.vst3/
          if-no-files-found: error
