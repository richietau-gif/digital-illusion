name: Build DI SIDECHAIN VST3
on:
  workflow_dispatch:
jobs:
  windows-vst3:
    # windows-2022 includes the Visual Studio 17.0 C++ toolchain used below.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S DI-SIDECHAIN -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          $exe = Get-ChildItem pluginval -Recurse -Filter pluginval.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "pluginval.exe not found" }
          $vst = Get-ChildItem "build/DISidechain_artefacts/Release/VST3" -Filter "*.vst3" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $vst) { throw "VST3 not found" }
          & $exe --strictness-level 5 --validate-in-process --timeout-ms 120000 --validate $vst
          if ($LASTEXITCODE -ne 0) { throw "pluginval failed with exit code $LASTEXITCODE" }
      - name: Package release candidate
        shell: pwsh
        run: |
          $vst = Get-ChildItem "build/DISidechain_artefacts/Release/VST3" -Filter "*.vst3" | Select-Object -First 1
          if (-not $vst) { throw "VST3 not found for packaging" }
          Compress-Archive -Path $vst.FullName -DestinationPath "DI-SIDECHAIN-5.0-RC-Windows-x64.zip" -Force
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: DI-SIDECHAIN-Windows-VST3
          path: DI-SIDECHAIN-5.0-RC-Windows-x64.zip
          if-no-files-found: error
