name: PRECISION SIDECHAIN Windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S DI-SIDECHAIN -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --target PrecisionSidechain
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path "build/DI-SIDECHAIN_artefacts/Release/VST3/PRECISION SIDECHAIN.vst3" -DestinationPath "PRECISION-SIDECHAIN-1.0-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PRECISION-SIDECHAIN-1.0-Windows-x64
          path: PRECISION-SIDECHAIN-1.0-Windows-x64.zip
